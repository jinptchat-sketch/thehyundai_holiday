<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>추석 이관일 데스크</title>

<style id="css">
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ground:#f4f2f0; --surface:#ffffff; --surface2:#faf7f6;
  --line:#e5dedb; --line2:#efe9e6;
  --ink:#1e1a1c; --muted:#786a6f; --muted2:#9a8b90;
  --green:#7b2d3b;                  /* 상단 라인 — 자주색 */
  --accent:#7b2d3b; --accent-ink:#ffffff; --accent-soft:#f4e7e9;
  --ok:#1c6746; --ok-bg:#e7f1ec; --ok-line:#bcdac9;
  --warn:#93571c; --warn-bg:#f9efe1; --warn-line:#e5cfab;
  --bad:#a52c28; --bad-bg:#f9e8e7; --bad-line:#e6bdba;
  --shadow:0 1px 2px rgba(30,26,28,.05), 0 8px 24px -12px rgba(30,26,28,.18);
  --r:12px;
  --sans:'IBM Plex Sans KR','Malgun Gothic','\B9D1\C740 \ACE0\B515',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151214; --surface:#1e1a1e; --surface2:#252025;
    --line:#342c34; --line2:#2b242b;
    --ink:#f1eaec; --muted:#a89aa0; --muted2:#8a7c82;
    --green:#e2909e;
    --accent:#e2909e; --accent-ink:#25131a; --accent-soft:#33212a;
    --ok:#6cc79a; --ok-bg:#17302a; --ok-line:#2c5344;
    --warn:#dda76c; --warn-bg:#332619; --warn-line:#59422a;
    --bad:#eb908b; --bad-bg:#361f1f; --bad-line:#5c3634;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
    --ground:#151214; --surface:#1e1a1e; --surface2:#252025;
  --line:#342c34; --line2:#2b242b;
  --ink:#f1eaec; --muted:#a89aa0; --muted2:#8a7c82;
  --green:#e2909e;
  --accent:#e2909e; --accent-ink:#25131a; --accent-soft:#33212a;
  --ok:#6cc79a; --ok-bg:#17302a; --ok-line:#2c5344;
  --warn:#dda76c; --warn-bg:#332619; --warn-line:#59422a;
  --bad:#eb908b; --bad-bg:#361f1f; --bad-line:#5c3634;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── brand bar — 유일한 초록 라인 ────────── */
.top{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:2px solid var(--accent)}
.top-in{max-width:1040px;margin:0 auto;padding:13px 28px;display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;color:var(--accent)}
.brand h1{font-size:21px;font-weight:800;letter-spacing:.14em;color:var(--ink);
  white-space:nowrap;line-height:1.15}
.util{margin-left:auto;display:flex;align-items:center;gap:16px}
.clock{text-align:right;line-height:1.25}
.clock .k{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted2);font-weight:600}
.clock b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock .t{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:9px 15px;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;color:var(--ink);white-space:nowrap}
.ghost:hover{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

.wrap{max-width:900px;margin:0 auto;padding:6px 28px 90px;display:flex;flex-direction:column;gap:30px}
.step{display:flex;flex-direction:column;gap:12px}
.lab{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.12em;
  color:var(--ink);margin-top:12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.num{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}

/* ── tabs / 3단계 선택 ─────────────────── */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 200px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .14s,background .14s,color .14s}
.tab b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.tab span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
.tab:hover{border-color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tab[aria-pressed="true"] b{color:var(--accent-ink)}
.tab[aria-pressed="true"] span{color:var(--accent-ink);opacity:.68}

/* ── region search ─────────────────────── */
.sbox{position:relative}
#q{width:100%;padding:20px 56px 20px 20px;font-size:22px;font-weight:700;letter-spacing:-.015em;
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);outline:none;color:var(--ink)}
#q::placeholder{color:var(--muted2);font-weight:400;font-size:16.5px;letter-spacing:0}
#q:focus{border-color:var(--ink)}
#clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);cursor:pointer;font-size:14px;display:none}
#clr:hover{border-color:var(--ink);color:var(--ink)}
.sugg{display:flex;gap:7px;flex-wrap:wrap;min-height:30px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 13px;
  font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip .sub{color:var(--muted2);font-size:11.5px;margin-left:6px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.hint b{color:var(--ink);font-weight:700}

/* ── answer card ───────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow)}
.stripe{display:flex;align-items:center;gap:11px;padding:13px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card.yes .stripe{background:var(--ok-bg);border-bottom-color:var(--ok-line)}
.card.partial .stripe{background:var(--warn-bg);border-bottom-color:var(--warn-line)}
.card.no .stripe{background:var(--bad-bg);border-bottom-color:var(--bad-line)}
.card.ask .stripe{background:var(--surface2)}
.tagv{font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:5px 11px;border-radius:var(--r);color:#fff}
.card.yes .tagv{background:var(--ok)} .card.partial .tagv{background:var(--warn)}
.card.no .tagv{background:var(--bad)} .card.ask .tagv{background:var(--accent);color:var(--accent-ink)}
:root[data-theme="dark"] .card.yes .tagv,:root[data-theme="dark"] .card.partial .tagv,:root[data-theme="dark"] .card.no .tagv,
:root:not([data-theme="light"]) .card.yes .tagv,:root:not([data-theme="light"]) .card.partial .tagv,
:root:not([data-theme="light"]) .card.no .tagv{color:var(--ground)}
.place{font-size:15.5px;font-weight:700}
.body{padding:24px 22px 22px}
.overline{font-size:11.5px;font-weight:600;letter-spacing:.16em;color:var(--muted)}

/* 날짜 + 배송센터 나란히 */
.answerRow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin-top:8px;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.answer{font-size:clamp(30px,6.6vw,44px);font-weight:900;letter-spacing:-.035em;line-height:1.04;
  font-variant-numeric:tabular-nums}
.card.no .answer,.card.ask .answer{font-size:clamp(21px,4.6vw,27px);letter-spacing:-.02em;font-weight:800}
.card.no .answer{color:var(--bad)}
.via{display:flex;flex-direction:column;gap:1px;min-width:0}
.via .vk{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted2)}
.via b{font-size:clamp(24px,5.4vw,36px);font-weight:800;letter-spacing:-.025em;color:var(--ink);line-height:1.1}
.via .vs{font-size:13px;color:var(--muted);font-weight:500}

/* ── 경우가 둘로 갈릴 때 나란히 ── */
.bodyflat{padding:0}
.panes{display:grid;grid-template-columns:1fr 1fr}
.pane{padding:20px 22px 20px;min-width:0;border-top:3px solid transparent}
.pane+.pane{border-left:1px solid var(--line)}
.pane.ok  {border-top-color:var(--ok);  background:var(--ok-bg)}
.pane.warn{border-top-color:var(--warn);background:var(--warn-bg)}
.pane.off {border-top-color:var(--bad); background:var(--bad-bg)}
.phead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:2px}
.pbadge{font-size:12px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:6px;color:#fff;white-space:nowrap}
.pane.ok .pbadge{background:var(--ok)}
.pane.warn .pbadge{background:var(--warn)}
.pane.off .pbadge{background:var(--bad)}
:root[data-theme="dark"] .pbadge,
:root:not([data-theme="light"]) .pbadge{color:var(--ground)}
.pane .deadline{background:var(--surface)}
.pane .flag{background:var(--surface);border-color:var(--line)}
.stripe.plain{background:var(--surface2)}
.pk{font-size:14pt;font-weight:800;letter-spacing:-.015em}
.ps{font-size:12.5px;color:var(--muted);margin:2px 0 13px}
.pane .answer{font-size:clamp(21px,3.4vw,30px);font-weight:900;letter-spacing:-.03em;line-height:1.06}
.pane.off .answer{color:var(--bad);font-size:clamp(16px,2.4vw,20px);font-weight:800}
.preason{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
.pane .via{margin-top:9px}
.pane .via b{font-size:clamp(18px,2.9vw,25px);line-height:1.12}
.pane .deadline{margin-top:12px;padding:10px 12px}
.pane .deadline .v{font-size:15px}
.pane .flag{margin-top:10px;font-size:11.5px;padding:8px 11px}
.panefoot{padding:0 22px 20px}
@media(max-width:720px){
  .panes{grid-template-columns:1fr}
  .pane+.pane{border-left:0;border-top:1px solid var(--line)}
}

.deadline{margin-top:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;
  padding:14px 17px;background:var(--surface2);border:1px solid var(--line2);
  border-left:2px solid var(--accent);border-radius:0}
.deadline .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);width:100%}
.deadline .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.deadline .left{font-size:13px;font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums}
.deadline .left.urgent{color:var(--bad)}
.facts{margin-top:16px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700}
.flag{margin-top:15px;background:var(--surface2);border:1px solid var(--line);border-left:2px solid var(--muted2);
  border-radius:0;padding:11px 14px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.flag span{line-height:1.55}
.picks{margin-top:15px;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;cursor:pointer}
.pick:hover{border-color:var(--ink);background:var(--accent-soft)}
.pick b{font-size:15px;font-weight:700}
.pick span{font-size:12px;color:var(--muted)}

/* ── compare table ─────────────────────── */
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
details.more>summary{cursor:pointer;list-style:none;padding:13px 20px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;color:var(--ink)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'\FF0B';margin-left:auto;color:var(--muted2);font-weight:400}
details.more[open]>summary::after{content:'\FF0D'}
details.more>summary:hover{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;padding:11px 16px;font-size:11px;letter-spacing:.1em;font-weight:700;
  color:var(--muted);background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-top:1px solid var(--line2);vertical-align:top}
tr.off td{color:var(--muted2)}
td.date{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cut{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r);white-space:nowrap}
.dot.yes{background:var(--ok-bg);color:var(--ok)} .dot.partial{background:var(--warn-bg);color:var(--warn)}
.dot.no{background:var(--bad-bg);color:var(--bad)}
.why{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}

/* ── station overview ──────────────────── */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;transition:border-color .14s}
.ov:hover{border-color:var(--ink)}
.ov .nm{font-size:14.5px;font-weight:800;color:var(--ink)}
.ov .it{font-size:11px;color:var(--muted2);margin-top:2px;line-height:1.4}
.ov .dt{font-size:20px;font-weight:900;letter-spacing:-.025em;margin-top:11px;font-variant-numeric:tabular-nums}
.ov .cu{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.ov.done .nm{color:var(--muted2)}
.ov.done .dt{color:var(--muted2);font-size:16px;font-weight:700}
.foot{font-size:11.5px;color:var(--muted2);line-height:1.7;border-top:1px solid var(--line);padding-top:18px;margin-top:10px}

/* ── admin ─────────────────────────────── */
.modal{position:fixed;inset:0;background:rgba(10,10,10,.62);z-index:90;display:none;overflow-y:auto;padding:26px 12px}
.modal.open{display:block}
.sheet{max-width:820px;margin:0 auto;background:var(--ground);border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.sheet .bar{background:var(--surface);border-bottom:1px solid var(--ink);padding:16px 22px;display:flex;align-items:center;gap:14px}
.sheet .bar h2{font-family:'Gowun Batang',serif;font-size:18px;font-weight:900;letter-spacing:-.01em}
.sheet .bar p{font-size:12px;color:var(--muted)}
.sheet .pad{padding:20px 22px 26px;display:flex;flex-direction:column;gap:13px}
.gate{max-width:340px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px}
.gate h3{font-size:17px;font-weight:700}
.gate p{font-size:12.5px;color:var(--muted);line-height:1.6}
input[type=text],input[type=password],input[type=number],input[type=date],textarea{
  width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:96px;font-size:12px;line-height:1.6;resize:vertical}
.f{display:flex;flex-direction:column;gap:6px}
.f>label{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.f .note{font-size:11px;color:var(--muted2);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.solid{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:11px 18px;font-size:13.5px;font-weight:700;letter-spacing:.02em;cursor:pointer}
.solid:hover{opacity:.88}
.outline{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:11px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
.outline:hover{border-color:var(--ink)}
.outline.danger{color:var(--bad);border-color:var(--bad-line)}
.outline.danger:hover{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
details.rt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.rt>summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
details.rt>summary::-webkit-details-marker{display:none}
details.rt>summary::after{content:'\C124\C815';margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted2)}
details.rt[open]>summary::after{content:'\B2EB\AE30'}
details.rt .in{padding:2px 16px 16px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:12px}
.cutrow{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center}
.cutrow .cl{font-size:12.5px;font-weight:600}
.qrow{display:grid;grid-template-columns:1fr 165px 120px;gap:10px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line2)}
.qrow .qn{font-size:13.5px;font-weight:700}
.qrow .qa{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.qrow input[type=date]{padding:8px 9px;font-size:13px}
.manual{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;
  border-radius:var(--r);background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}
@media (max-width:640px){.qrow{grid-template-columns:1fr 1fr}.qrow .qa{grid-column:1/-1;text-align:left}}
.msg{border-radius:var(--r);padding:11px 14px;font-size:12.5px;font-weight:600;display:none}
.msg.show{display:block}
.msg.good{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.msg.bad{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.banner{background:var(--surface2);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:0;padding:12px 15px;font-size:12.5px;color:var(--ink);line-height:1.6}
.err{font-size:12.5px;color:var(--bad);font-weight:600;display:none}
@media (max-width:640px){
  .top-in{padding:13px 18px}
  .hero{padding:36px 18px 22px}
  .wrap{padding:6px 18px 72px}
  .util{gap:11px}
  .clock .k{display:none}
  .grid2{grid-template-columns:1fr}
  .cutrow{grid-template-columns:1fr 1fr 1fr}
  .answerRow{gap:4px 14px}
}
</style>

<template id="shell">
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="eyebrow" id="eyebrow">2026 추석 행사</span>
      <h1 id="pageTitle">THE HYUNDAI</h1>
    </div>
    <div class="util">
      <div class="clock">
        <span class="k">한국시간 기준 오늘</span>
        <b id="todayTxt">–</b>
        <span class="t" id="nowTxt">–</span>
      </div>
      <button class="ghost" id="adminOpen">관리자</button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="step">
    <h2 class="lab"><span class="num">1</span>품목 고르기</h2>
    <div class="chips" id="tabs"></div>
  </section>
  <section class="step">
    <h2 class="lab"><span class="num">2</span>배송 지역 검색</h2>
    <div class="sbox">

/* 조회된 지역이 도서산간인지 / 읍·면·리인지 판별 */

function isIsland(cand){

var PICKED=null;

/* ── 한국시간 ─────────────────────────── */
function kstParts(){
  var f=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  var p={}; f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var H=parseInt(p.hour,10); if(H===24)H=0;
  return {y:+p.year,m:+p.month,d:+p.day,H:H,M:+p.minute,S:+p.second};
}
function pad(n){return String(n).padStart(2,"0");}
function nowStamp(){var k=kstParts();return Date.UTC(k.y,k.m-1,k.d,k.H,k.M,k.S);}
function todayISO(){var k=kstParts();return k.y+"-"+pad(k.m)+"-"+pad(k.d);}
function stampOf(iso,t){var a=iso.split("-").map(Number),b=(t||"00:00").split(":").map(Number);
  return Date.UTC(a[0],a[1]-1,a[2],b[0],b[1]);}
function addDays(iso,n){var a=iso.split("-").map(Number);
  var d=new Date(Date.UTC(a[0],a[1]-1,a[2])+n*86400000);
  return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function wdOf(iso){var a=iso.split("-").map(Number);return WD[new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay()];}
function fmtD(iso){var a=iso.split("-");return (+a[1])+"월 "+(+a[2])+"일 ("+wdOf(iso)+")";}
function fmtS(iso){var a=iso.split("-");return (+a[1])+"/"+(+a[2])+"("+wdOf(iso)+")";}

/* ── 운영일 ───────────────────────────── */
function parseSpec(spec){
  var out=[]; if(!spec) return out;
  String(spec).split(",").forEach(function(tok){
    tok=tok.trim(); if(!tok) return;
    if(tok.indexOf("~")>-1){
      var ab=tok.split("~"),a=ab[0].trim(),b=ab[1]?ab[1].trim():"";
      if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||!/^\d{4}-\d{2}-\d{2}$/.test(b))return;
      var cur=a,g=0; while(cur<=b&&g++<400){out.push(cur);cur=addDays(cur,1);}
    } else if(/^\d{4}-\d{2}-\d{2}$/.test(tok)) out.push(tok);
  });
  return out;
}
function routeDates(r,item){
  var ex={},pex={};
  parseSpec(r.exclude).forEach(function(d){ex[d]=1;});
  parseSpec(r.postExclude).forEach(function(d){pex[d]=1;});
  var main=parseSpec(r.main).filter(function(d){return !ex[d];}).map(function(d){return {d:d,post:false};});
  var ps=r.post;
  if(r.postAlt&&r.postAlt[item]!==undefined) ps=r.postAlt[item];
  var post=parseSpec(ps).filter(function(d){return !pex[d];}).map(function(d){return {d:d,post:true};});
  return main.concat(post).sort(function(x,y){return x.d<y.d?-1:1;});
}
function cutoffFor(r,item,e){
  var grp=e.post?r.postCutoff:r.cutoff, c=grp[item]||grp.general;
  if(!c) return null;
  var iso=addDays(e.d,-c.d);
  return {iso:iso,t:c.t,stamp:stampOf(iso,c.t)};
}
/* 관리자가 직접 지정한 이관일 — 기준일 이후 하루씩 자동으로 밀림 */
function manualDate(r){
  if(!r.manual||!r.manual.date||!r.manual.from) return null;
  var diff=Math.round((stampOf(todayISO(),"00:00")-stampOf(r.manual.from,"00:00"))/86400000);
  return addDays(r.manual.date, diff>0?diff:0);
}
function earliest(r,item0,now){
  var item=routeItem(r,item0);
  if(r.items.indexOf(item)<0) return null;
  var man=manualDate(r);
  if(man){
    var all=routeDates(r,item), last=all.length?all[all.length-1].d:null;
    var me={d:man,post:false};
    return {date:man,post:false,cut:cutoffFor(r,item,me),manual:true,
            stale:(last&&man>last)};
  }
  var list=routeDates(r,item);
  for(var i=0;i<list.length;i++){
    var c=cutoffFor(r,item,list[i]);
    if(c&&now<c.stamp) return {date:list[i].d,post:list[i].post,cut:c};
  }
  return null;
}

/* ── 행정구역 해석 ─────────────────────── */
function sidoOf(i){return GEO.sido[GEO.sgg[i][0]];}
function sggOf(i){return GEO.sgg[i][1];}
function clean(s){return String(s||"").replace(/\(.*?\)/g,"").replace(/\s+/g,"").trim();}
function josa(w){
  var c=String(w||"").slice(-1).charCodeAt(0)-0xAC00;
  if(c<0||c>11171) return "는";
  return (c%28)?"은":"는";
}
function kind(name){
  var c=name.slice(-1);
  if(c==="읍")return "읍"; if(c==="면")return "면"; if(c==="리")return "리";
  if(c==="동"||c==="가")return "동";
  return "동";
}
/* 토큰 분류 */
function asSido(t){ t=clean(t); return SIDO_ALIAS[t]||null; }
function asGroup(t){
  t=clean(t);
  for(var i=0;i<GROUPS.length;i++) if(GROUPS[i].match.indexOf(t)>-1) return GROUPS[i];
  return null;
}
/* 시·군·구 색인: "수원시 장안구" → city="수원시", gu="장안구" */
var SGGINFO=GEO.sgg.map(function(row,i){
  var raw=String(row[1]), full=raw.replace(/\s+/g,"");
  var m=full.match(/^(.+?[시군])(.+구)$/);
  return {i:i, sido:GEO.sido[row[0]], full:full,
          city:m?m[1]:full, gu:m?m[2]:null,
          cityStem:(m?m[1]:full).replace(/(시|군|구)$/,"")};
});
/* 도시 단위 묶음: 같은 city 를 가진 시·군·구들 */
var CITYGRP={};
SGGINFO.forEach(function(s){
  var k=s.sido+"|"+s.city;
  (CITYGRP[k]=CITYGRP[k]||[]).push(s);
});
function asSgg(t){
  t=clean(t); if(t.length<2) return [];
  var out=[];
  SGGINFO.forEach(function(s){
    if(s.full===t||(s.gu&&s.gu===t)) out.push(s.i);
  });
  if(out.length) return out;
  SGGINFO.forEach(function(s){
    if(s.city===t||s.cityStem===t) out.push(s.i);
  });
  if(out.length) return out;
  SGGINFO.forEach(function(s){
    if(s.gu&&s.gu.replace(/구$/,"")===t) out.push(s.i);
  });
  return out;
}
/* 같은 도시(시·군)의 구들을 하나의 후보로 묶기 */
function groupByCity(idxs){
  var buckets={},order=[];
  idxs.forEach(function(i){
    var s=SGGINFO[i], k=s.sido+"|"+s.city;
    if(!buckets[k]){buckets[k]=[];order.push(k);}
    buckets[k].push(s);
  });
  return order.map(function(k){
    var arr=buckets[k], s0=arr[0];
    var whole=(CITYGRP[k]||[]).length===arr.length;
    if(arr.length===1) return {sido:s0.sido,sggs:[String(GEO.sgg[s0.i][1])],label:candLabel(s0.i,null)};
    var sd=shortSido(s0.sido);
    var head=(sd===s0.city||s0.city.indexOf(sd)===0)?s0.city:sd+" "+s0.city;
    return {sido:s0.sido,sggs:arr.map(function(s){return String(GEO.sgg[s.i][1]);}),
            label:head+(whole?"":" 일부")};
  });
}
function asEmd(t,loose){
  t=clean(t); if(!t) return [];
  if(GEO.emd[t]) return GEO.emd[t].map(function(i){return {sgg:i,name:t};});
  if(!loose) return [];
  var hit=null,k;
  for(k in GEO.emd){ if(k.length===t.length+1&&k.indexOf(t)===0&&/[동읍면리가]/.test(k.slice(-1))){hit=k;break;} }
  return hit?GEO.emd[hit].map(function(i){return {sgg:i,name:hit};}):[];
}
/* 붙여 쓴 질의 분리: "부산북구" → ["부산","북구"] (긴 접두어 우선, 뒷말이 실제 지역일 때만) */
var COMBO_PREFIX=(function(){
  var out=[],k,i,j;
  for(k in SIDO_ALIAS) out.push(k);
  for(i=0;i<GROUPS.length;i++) for(j=0;j<GROUPS[i].match.length;j++) out.push(GROUPS[i].match[j]);
  return out.sort(function(a,b){return b.length-a.length;});
})();
function splitCombo(t){
  t=clean(t);
  for(var i=0;i<COMBO_PREFIX.length;i++){
    var p=COMBO_PREFIX[i];
    if(t.length>p.length&&t.indexOf(p)===0){
      var rest=t.slice(p.length);
      if(GEO.emd[rest]||asSgg(rest).length||asSido(rest)) return [p,rest];
    }
  }
  return [t];
}
var GWANGJU_GU=["동구","서구","남구","북구","광산구"];
var SIDO_SHORT={"서울특별시":"서울","부산광역시":"부산","대구광역시":"대구","인천광역시":"인천",
 "대전광역시":"대전","울산광역시":"울산","세종특별자치시":"세종","경기도":"경기",
 "강원특별자치도":"강원","충청북도":"충북","충청남도":"충남","전북특별자치도":"전북",
 "경상북도":"경북","경상남도":"경남","제주특별자치도":"제주","전남광주통합특별시":"전남광주"};
function shortSido(s){ return SIDO_SHORT[s]||s; }
function prettySgg(i){var s=SGGINFO[i];return s.gu?(s.city+" "+s.gu):s.full;}
function candLabel(sggIdx,emd){
  var s=sidoOf(sggIdx), g=prettySgg(sggIdx), sd=shortSido(s);
  if(s==="전남광주통합특별시"&&GWANGJU_GU.indexOf(g)>-1) sd="광주광역시";
  var head = (sd===g||g.indexOf(sd)===0) ? g : sd+" "+g;
  return head+(emd?" "+emd:"");
}
function resolveQuery(q){
  var raw=String(q||"").trim(); if(!raw) return [];
  var toks=raw.split(/[\s,]+/).filter(Boolean);
  if(toks.length===1) toks=splitCombo(toks[0]);
  toks=toks.map(clean).filter(Boolean);
  if(!toks.length) return [];

  /* 범위 필터 (시·도, 시·군·구) 와 대상 토큰 분리 */
  var scopeSido=null, scopeSgg=null, scopeGroup=null, target=null, targetKind=0;
  function build(loose){
    return toks.map(function(t){
      return {t:t, sido:asSido(t), group:asGroup(t), sgg:asSgg(t), emd:asEmd(t,loose)};
    });
  }
  var infos=build(false);
  if(!infos.some(function(f){return f.emd.length||f.sgg.length||f.sido||f.group;})) infos=build(true);
  infos.forEach(function(f){
    var k = f.emd.length?3 : (f.sgg.length?2 : ((f.sido||f.group)?1:0));
    if(k>targetKind){ if(target) demote(target); target=f; targetKind=k; }
    else demote(f);
  });
  function demote(f){
    if(f.group&&!scopeGroup) scopeGroup=f.group;
    else if(f.sido&&!scopeSido) scopeSido=f.sido;
    else if(f.sgg.length&&!scopeSgg) scopeSgg=f.sgg;
  }
  if(!target||targetKind===0) return [];

  var cands=[];
  function ok(i){
    if(scopeSido&&sidoOf(i)!==scopeSido) return false;
    if(scopeGroup&&(sidoOf(i)!==scopeGroup.sido||scopeGroup.sgg.indexOf(sggOf(i))<0)) return false;
    if(scopeSgg&&scopeSgg.indexOf(i)<0) return false;
    return true;
  }
  if(targetKind===3){
    target.emd.forEach(function(h){ if(ok(h.sgg))
      cands.push({label:candLabel(h.sgg,h.name),sido:sidoOf(h.sgg),sggs:[sggOf(h.sgg)],emd:h.name}); });
  } else if(targetKind===2){
    groupByCity(target.sgg.filter(ok)).forEach(function(g){
      cands.push({label:g.label,sido:g.sido,sggs:g.sggs,emd:null}); });
    /* "광주" 처럼 그룹도 함께 후보로 */
    var gp=asGroup(target.t);
    if(gp&&!scopeSido&&!scopeGroup) cands.push({label:gp.label,sido:gp.sido,sggs:gp.sgg.slice(),emd:null,note:gp.note});
  } else {
    if(target.group) cands.push({label:target.group.label,sido:target.group.sido,
      sggs:target.group.sgg.slice(),emd:null,note:target.group.note});
    else if(target.sido) cands.push({label:target.sido,sido:target.sido,sggs:null,emd:null});
  }
  /* 중복 제거 + 배송권역 우선 정렬 */
  var seen={},out=[];
  cands.forEach(function(c){var k=c.label+"|"+c.sido; if(!seen[k]){seen[k]=1;out.push(c);}});
  out.forEach(function(c){
    c.covered=CFG.routes.some(function(r){var j=judgeRoute(r,c);return j&&j.v!=="no"&&!j.nation;});
    c.parcel=CFG.routes.some(function(r){if(!routeHandles(r,ITEM))return false;
      var j=judgeRoute(r,c);return j&&j.v!=="no"&&j.nation;});
  });
  out.sort(function(a,b){return (b.covered?1:0)-(a.covered?1:0);});
  return out;
}

/* ── 배송 금지 규칙 ───────────────────── */
/* 특정 지역·품목은 어떤 수단으로도 보낼 수 없다.
   대체 택배로 넘기기 전에 먼저 걸러야 한다. */
function blockFor(cand,item){
  var bs=CFG.blocks||[];
  for(var i=0;i<bs.length;i++){
    var b=bs[i];
    if(b.items&&b.items.indexOf(item)<0) continue;
    if(b.sido&&b.sido!==cand.sido) continue;
    if(b.sgg&&b.sgg.length){
      var hit=(cand.sggs||[]).some(function(g){
        return b.sgg.some(function(x){return g===x||g.indexOf(x)===0;});});
      if(!hit) continue;
    }
    return b;
  }
  return null;
}
/* 이 지역으로 실제 발송이 되는 품목 탭 목록 */
function shippableItems(cand){
  return ITEM_TYPES.filter(function(t){
    var b=blockFor(cand,t.k); if(b&&b.reason) return false;
    return searchRoutes(cand,t.k).some(function(h){return h.j.v!=="no"&&h.e;});
  }).map(function(t){return t.n;});
}

/* ── 배송 판정 ────────────────────────── */
function inArea(a,sido,sgg){
  if(a.sido!==sido) return false;
  if(!a.sgg) return true;
  for(var i=0;i<a.sgg.length;i++) if(sgg===a.sgg[i]||sgg.indexOf(a.sgg[i])===0) return true;
  return false;
}
function judgeOne(r,sido,sgg,emd){
  var best=null;
  for(var i=0;i<r.areas.length;i++){
    var a=r.areas[i];
    if(a.nation){
      if(a.m==="rural"){
        var cr;
        /* ① 도서산간 — 가공식품만 택배 가능 */
        if((a.denySido||[]).indexOf(sido)>-1||(a.denySgg||[]).indexOf(sgg)>-1){
          cr=(ITEM==="general"&&FRESH==="processed")
            ? {v:"yes",why:"도서산간 지역이지만 가공식품은 택배로 발송합니다",label:sgg,nation:true}
            : {v:"no",why:(a.islandWhy||"도서산간 지역은 신선식품을 보낼 수 없습니다"),label:sgg};
          best=pick(best,cr); continue;
        }
        /* ② 내륙 — 읍·면·리는 금액과 무관하게 택배, 동은 10만원 이하일 때만 */
        if(emd){
          if(kind(emd)!=="동")
            cr={v:"yes",why:kind(emd)+" 지역이라 거점 차량이 아닌 택배로 발송합니다",label:sgg,nation:true};
          else if(ITEM==="general"&&PRICE==="under")
            cr={v:"yes",why:"10만원 이하 주문이라 택배로 발송합니다",label:sgg,nation:true};
          else
            /* 동 지역이라도 거점 권역이 아니면 택배가 답이 된다.
               거점 권역이면 아래 선택 단계에서 거점이 먼저 뽑히므로 이 값은 쓰이지 않는다. */
            cr={v:"yes",why:"거점 차량 배송 권역이 아니어서 택배로 발송합니다",label:sgg,nation:true,fallback:true};
        } else {
          cr={v:"yes",why:"거점 권역이 아닌 곳은 택배로 발송합니다",label:sgg,nation:true,fallback:true};
        }
        best=pick(best,cr); continue;
      }
      if(!best) best={v:"yes",why:"택배 전국배송 지역",label:"전국",nation:true}; continue; }
    if(!inArea(a,sido,sgg)) continue;
    var label=a.label||sgg;
    if((a.denySgg||[]).indexOf(sgg)>-1){ best=pick(best,{v:"no",why:sgg+josa(sgg)+" 거점 차량 배송 권역이 아닙니다",label:label}); continue; }
    var c;
    if(emd){
      if((a.deny||[]).indexOf(emd)>-1) c={v:"no",why:emd+josa(emd)+" 거점 차량 배송 권역이 아닙니다",label:label};
      else if((a.allow||[]).indexOf(emd)>-1) c={v:"yes",why:emd+" 배송 가능",label:label};
      else if(a.m==="all") c={v:"yes",why:(a.label||sgg)+" 배송 가능",label:label};
      else if(a.m==="dong") c=(kind(emd)==="동")
        ? {v:"yes",why:"동 지역이므로 배송 가능",label:label}
        : {v:"no",why:kind(emd)+" 지역은 거점 차량 미배송"+((a.allow||[]).length?" (차량 배송 가능: "+a.allow.join(", ")+")":""),label:label};
      else c={v:"no",why:"거점 차량 배송은 지정 지역만"+((a.allow||[]).length?" — "+a.allow.join(", "):""),label:label};
    } else {
      if(a.m==="all") c=(a.deny||[]).length
        ? {v:"partial",why:"일부 동은 거점 차량 미배송 — "+(a.deny||[]).join(", "),label:label}
        : {v:"yes",why:(a.label||sgg)+" 전지역 배송",label:label};
      else if(a.m==="dong") c={v:"partial",why:"동 지역만 거점 차량 배송 (읍·면·리 제외)"+
        ((a.allow||[]).length?" / 예외 가능: "+a.allow.join(", "):""),label:label};
      else c={v:"partial",why:"일부 지역만 거점 차량 배송 — "+(a.allow||[]).join(", "),label:label};
    }
    best=pick(best,c);
  }
  return best;
  function pick(x,y){ if(!x) return y; var w={yes:3,partial:2,no:1};
    return w[y.v]>w[x.v]?y:x; }
}
function judgeRoute(r,cand){
  if(!cand.sggs){
    /* 시·도 전체 */
    var vs=[],i;
    for(i=0;i<GEO.sgg.length;i++) if(sidoOf(i)===cand.sido){
      var j=judgeOne(r,cand.sido,sggOf(i),null); if(j) vs.push(j);
    }
    return merge(vs,cand);
  }
  var res=cand.sggs.map(function(g){return judgeOne(r,cand.sido,g,cand.emd);}).filter(Boolean);
  return merge(res,cand);
}
function merge(list,cand){
  if(!list.length) return null;
  var yes=list.filter(function(x){return x.v==="yes";}),
      par=list.filter(function(x){return x.v==="partial";}),
      no =list.filter(function(x){return x.v==="no";});
  if(yes.length&&!par.length&&!no.length) return yes[0];
  if(no.length&&!yes.length&&!par.length) return no[0];
  if(yes.length||par.length){
    var base=(par[0]||yes[0]);
    return {v: (list.length>1&&(no.length||par.length))?"partial":base.v,
            why: base.why + (no.length&&list.length>1 ? " (일부 구역 제외)" : ""), label:base.label,
            nation: base.nation};
  }
  return list[0];
}
function searchRoutes(cand,item){
  var hits=[],now=nowStamp();
  CFG.routes.forEach(function(r){
    if(!routeHandles(r,item)) return;
    var j=judgeRoute(r,cand); if(!j) return;
    hits.push({r:r,j:j,e:(j.v==="no")?null:earliest(r,item,now)});
  });
  return hits;
}

}

/* 한 조건에 대한 답을 계산한다 (화면은 만들지 않는다) */
function computeAnswer(cand,item){
  var out={hits:[],regionalCount:0};
  var blk=blockFor(cand,item);
  var hits=searchRoutes(cand,item); out.hits=hits;
  function byDate(a,b){
    var m=(a.e.manual?0:1)-(b.e.manual?0:1); if(m) return m;
    return a.e.date<b.e.date?-1:a.e.date>b.e.date?1:0;
  }
  var regional=hits.filter(function(h){return !h.r.nationwide&&h.j.v!=="no"&&h.e;}).sort(byDate);
  var parcel  =hits.filter(function(h){return h.r.nationwide&&h.e;}).sort(byDate);
  var blocked =hits.filter(function(h){return !h.r.nationwide&&h.j.v==="no";});
  var anyRegional=hits.some(function(h){return !h.r.nationwide&&h.j.v!=="no";});
  out.regionalCount=regional.length;
  if(blk&&blk.reason){
    out.ok=false; out.hard=true; out.title="발송 불가"; out.reason=blk.reason;
    out.shippable=shippableItems(cand); return out;
  }
  var hanjin=hits.filter(function(h){return h.r.items.indexOf("hanjin")>-1&&h.e;}).sort(byDate);
  var cjHit=hits.filter(function(h){return h.r.id==="cj-rural"&&h.e;})[0];
  var rc=regionClass(cand), top, mode;
  if(item==="general"&&cjHit&&((rc==="dong"&&PRICE==="under")||(rc==="island"&&FRESH==="processed"))){
    top=cjHit; mode="parcel";
  }
  else if(item==="hanjin"&&hanjin.length){ top=hanjin[0]; mode="parcel"; }
  else if(regional.length){ top=regional[0]; mode="center"; }
  else if(parcel.length){ top=parcel[0]; mode="parcel"; }
  else {
    var ended=hits.some(function(h){return h.j.v!=="no";});
    out.ok=false;
    out.title=ended?"남은 발송일이 없습니다":"배송 불가";
    var noWhy=(blocked[0]&&blocked[0].j.why)||
              ((hits.filter(function(h){return h.j.v==="no";})[0]||{j:{}}).j.why);
    out.reason=ended?"행사 운영 기간이 끝났거나 모든 이관 마감이 지났습니다."
                    :(noWhy||"이 지역은 배송 권역이 아닙니다.");
    out.shippable=shippableItems(cand); return out;
  }
  var notes=(top.r.notes||[]).filter(function(n){return item==="cold"||!/냉장육|정육/.test(n);});
  if(top.e.post) notes=["명절 이후 사후배송 일정입니다"].concat(notes);
  if(cand.note) notes=notes.concat([cand.note]);
  if(mode==="parcel"&&blocked.length)
    notes=["거점 차량이 들어가지 않는 지역이라 택배로만 발송됩니다 — "+blocked[0].j.why].concat(notes);
  if(top.r.id==="cj-rural"&&rc!=="rural"){
    notes=notes.filter(function(n){return n.indexOf("읍·면·리 지역이라")<0&&n.indexOf("택배로만 발송됩니다")<0;});
    var endedRegional=hits.some(function(h){return !h.r.nationwide&&h.j.v!=="no"&&!h.e;});
    notes=[ rc==="island" ? "도서산간 지역이라 가공식품만 CJ대한통운 택배로 발송할 수 있습니다"
      : !anyRegional ? "거점 차량 배송 권역이 아니어서 CJ대한통운 택배로 발송합니다"
      : endedRegional ? "거점 운영 기간이 끝나 CJ대한통운 택배로 발송합니다"
      : (item==="general"&&PRICE==="under") ? "10만원 이하 주문이라 거점 차량이 아닌 CJ대한통운 택배로 발송합니다"
      : "거점 차량 배송 권역이 아니어서 CJ대한통운 택배로 발송합니다"].concat(notes);
  }
  if(blk&&blk.warn) notes=[blk.warn].concat(notes);
  if(top.e.stale) notes=["⚠ 관리자가 지정한 이관일이 행사 운영 기간을 넘었습니다. 관리자 설정에서 날짜를 다시 확인하세요."].concat(notes);
  out.ok=true; out.top=top; out.mode=mode; out.notes=notes;
  out.vclass=(mode==="parcel")?"partial":top.j.v;
  out.tag=(mode==="center")?"백화점 택배차량":"일반배송";
  return out;
}

function moreTable(hits){
  if(!hits.length) return "";
  var rows=hits.map(function(h){
    var off=(h.j.v==="no"&&!h.r.nationwide)||!h.e;
    var dt=h.e?fmtS(h.e.date)+(h.e.post?" 사후":""):"—";
    var cu=h.e?fmtS(h.e.cut.iso)+" "+h.e.cut.t:"—";

    var txt=h.r.nationwide?"택배":(h.j.v==="yes"?"거점 배송":h.j.v==="no"?"거점 미배송":"조건부");
    var why=h.r.nationwide?"전국 택배 배송":h.j.why;
    return '<tr class="'+(off?"off":"")+'"><td><b>'+esc(h.r.center)+'</b>'+
      (h.r.sub?'<span class="why">'+esc(h.r.sub)+'</span>':'')+'</td>'+
      '<td><span class="dot '+v+'">'+txt+'</span>'+
      '<span class="why">'+esc(why)+'</span></td>'+
      '<td class="date">'+dt+'</td><td class="cut">'+cu+'</td></tr>';}).join("");
  return '<details class="more"><summary>다른 거점 '+hits.length+'곳 비교</summary><div class="scroll">'+
    '<table><thead><tr><th>거점</th><th>판정</th><th>최단 발송일</th><th>이관 마감</th></tr></thead>'+

function renderOverview(){
  var now=nowStamp();
  $("overview").innerHTML=CFG.routes.map(function(r){
    if(!routeHandles(r,ITEM)) return "";
    var e=earliest(r,ITEM,now);

function renderSugg(){
  var q=clean($("q").value), box=$("sugg");
  if(!q||q.length<1){
    box.innerHTML=["서울","부산","대전","오창읍","달성군","울주군","광주"].map(function(n){
      return '<button class="chip" data-v="'+n+'">'+n+'</button>';}).join("");
  } else {
    var hits=[],k,n=0;
    for(k in GEO.emd){ if(k.indexOf(q)===0){hits.push(k); if(++n>=40)break;} }
    if(hits.length<6){
      for(var i=0;i<GEO.sgg.length&&hits.length<12;i++){
        var g=clean(sggOf(i));
        if(g.indexOf(q)===0&&hits.indexOf(g)<0) hits.push(g);
      }
    }
    hits=hits.slice(0,8);
    box.innerHTML=hits.map(function(x){
      var loc=GEO.emd[x]?GEO.emd[x].map(function(i){return candLabel(i,null);}):[];
      var sub=loc.length===1?loc[0]:(loc.length>1?loc.length+"곳":"");
      return '<button class="chip" data-v="'+esc(x)+'">'+esc(x)+
        (sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</button>';}).join("");
  }
  Array.prototype.forEach.call(box.children,function(b){
    b.onclick=function(){$("q").value=b.dataset.v;PICKED=null;renderSugg();renderResult();};});
}

/* 웹에 올린 경우 같은 폴더의 config.json 이 진짜 설정이다.
   페이지를 다시 올리지 않고 이 작은 파일만 교체하면 모두에게 반영된다.
   file:// 로 열었거나 파일이 없으면 페이지에 내장된 설정을 그대로 쓴다. */
function loadRemoteCfg(){
  if(!/^https?:$/.test(location.protocol)) return Promise.resolve(null);
  if(typeof fetch!=="function") return Promise.resolve(null);
  return fetch("config.json?t="+Date.now(),{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(o){ return (o&&o.routes&&o.routes.length)?o:null; })
    ["catch"](function(){ return null; });
}
function readLocal(){
  try{var raw=localStorage.getItem(LSKEY); if(!raw)return null;
      var o=JSON.parse(raw); if(o&&o.base===CFG.stamp) return o.cfg;}catch(e){}
  return null;
}
function writeLocal(cfg){
  try{localStorage.setItem(LSKEY,JSON.stringify({base:CFG.stamp,cfg:cfg}));return true;}catch(e){return false;}
}

    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>'+esc(cfg.meta.title||"추석 이관일 데스크")+'</title>'+css+'</head><body>'+

function earliestAuto(r){
  var keep=r.manual; delete r.manual;
  var item=routeHandles(r,ITEM)?ITEM:r.items[0];

  if(keep) r.manual=keep;
  return e?e.date:null;

function saveFields(){
  document.querySelectorAll('#adminPad input[data-man]').forEach(function(el){
    var r=CFG.routes[+el.dataset.r], v=el.value.trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) r.manual={from:todayISO(),date:v};
    else delete r.manual;
  });
  document.querySelectorAll('#adminPad input[data-f]').forEach(function(el){
    CFG.routes[+el.dataset.r][el.dataset.f]=el.value.trim();});
  document.querySelectorAll('#adminPad input[data-alt]').forEach(function(el){
    var r=CFG.routes[+el.dataset.r]; if(!r.postAlt)r.postAlt={};
    r.postAlt[el.dataset.alt]=el.value.trim();});
  document.querySelectorAll('#adminPad input[data-g]').forEach(function(el){
    var r=CFG.routes[+el.dataset.r],g=el.dataset.g,k=el.dataset.k;
    if(!r[g][k]) r[g][k]={d:1,t:"15:00"};
    if(el.dataset.p==="d") r[g][k].d=Math.max(0,parseInt(el.value,10)||0);
    else{var v=el.value.trim(); if(/^\d{1,2}:\d{2}$/.test(v)) r[g][k].t=v.length===4?"0"+v:v;}});
  if($("newPw")&&$("newPw").value.trim()) CFG.meta.password=$("newPw").value.trim();
  if($("newTitle")&&$("newTitle").value.trim()) CFG.meta.title=$("newTitle").value.trim();
  if($("newEyebrow")) CFG.meta.eyebrow=$("newEyebrow").value.trim();
  if($("updBy")) CFG.meta.updatedBy=$("updBy").value.trim();
  if($("updNote")) CFG.meta.updateNote=$("updNote").value.trim();
  CFG.meta.updatedAt=todayISO();
  renderAll();
}

    var msg = ENV==="web"
      ? "저장했습니다. 이어서 [config.json 내용 복사]를 누르고, 사이트의 config.json 에 붙여넣어야 모두에게 반영됩니다."
      : "저장했습니다. 아래 [설정 반영된 HTML 파일 내려받기]로 공유 폴더 파일을 덮어쓰면 모두에게 반영됩니다.";
    flash(ok?msg:"이 브라우저에 저장할 수 없어 현재 화면에만 적용했습니다. 설정 코드를 꺼내 보관하세요.",ok);
  }
}

/* ── 시작 ─────────────────────────────── */
function renderAll(){renderClock();renderResult();renderOverview();renderFoot();}
function boot(){
  document.getElementById("app").appendChild(document.getElementById("shell").content.cloneNode(true));
  var local=readLocal(); if(local) CFG=local;
  renderTabs();renderPrice(null);renderSugg();renderAll();
  loadRemoteCfg().then(function(o){
    if(!o) return;
    CFG=o;
    var l2=readLocal(); if(l2) CFG=l2;
    renderTabs();renderPrice(null);renderAll();
  });
  $("q").addEventListener("input",function(){PICKED=null;renderSugg();renderResult();});
  $("clr").onclick=function(){$("q").value="";PICKED=null;renderSugg();renderResult();$("q").focus();};
  $("adminOpen").onclick=openAdmin;
  $("adminClose").onclick=closeAdmin;
  $("pwGo").onclick=function(){
    if($("pw").value===CFG.meta.password){unlocked=true;$("pwErr").style.display="none";paintAdmin();}
    else $("pwErr").style.display="block";};
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("pwGo").click();});
  $("adminModal").addEventListener("click",function(e){if(e.target===$("adminModal"))closeAdmin();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAdmin();});
  setInterval(renderAll,60000);
  if(window.matchMedia("(min-width:700px)").matches) $("q").focus();
  if(window.claude&&claude.use){
    claude.use("artifact").then(function(a){
      ART=a; ENV=a?"link-editor":"link-viewer"; ARTREADY=true; renderFoot();
    })["catch"](function(){ENV="link-viewer";ARTREADY=true;renderFoot();});
  } else { ENV=/^https?:$/.test(location.protocol)?"web":"file"; ARTREADY=true; renderFoot(); }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
